$kind: http-request
description: "RTM: REQ-API-010 | Expected response code: 404 | Expected message: User not found!"
url: "{{base_url}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{invalid_email}}"
    password: "{{invalid_password}}"
scripts:
  - type: afterResponse
    code: |-
      // check the transport response
      pm.test('transport status is 200', function () {
        pm.response.to.have.status(200);
      });

      // read the api result
      const body = pm.response.json();

      // check the documented business code
      pm.test('business response code is 404', function () {
        pm.expect(Number(body.responseCode)).to.eql(404);
      });

      // check the documented message
      pm.test('response message is correct', function () {
        pm.expect(body.message).to.eql("User not found!");
      });
    language: text/javascript
order: 4000
