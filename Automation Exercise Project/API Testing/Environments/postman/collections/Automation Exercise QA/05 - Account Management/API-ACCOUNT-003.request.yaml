$kind: http-request
name: API-ACCOUNT-003 - Update User Account
description: "RTM: REQ-API-013 | Expected response code: 200 | Expected message: User updated!"
url: "{{base_url}}/updateAccount"
method: PUT
body:
  type: urlencoded
  content:
    name: "{{user_name}}"
    email: "{{account_email}}"
    password: "{{account_password}}"
    title: Mr
    birth_date: "1"
    birth_month: January
    birth_year: "1990"
    firstname: Kevin
    lastname: Tester
    company: QA Portfolio
    address1: 123 Test Street
    address2: Suite 1
    country: United States
    zipcode: "10001"
    state: New York
    city: New York
    mobile_number: "5550101000"
scripts:
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 200\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(200);\r

      });\r

      \r

      pm.test(\"Account update message is correct\", function () {\r

      \    pm.expect(response.message).to.eql(\"User updated!\");\r

      });"
    language: text/javascript
examples: .resources/API-ACCOUNT-003.resources/examples
order: 3000
