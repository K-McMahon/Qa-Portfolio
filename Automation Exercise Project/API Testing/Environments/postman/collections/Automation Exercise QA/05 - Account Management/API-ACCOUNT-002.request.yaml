$kind: http-request
name: API-ACCOUNT-002 - Delete User Account
description: "RTM: REQ-API-012 | Expected response code: 200 | Expected message: Account deleted!"
url: "{{base_url}}/deleteAccount"
method: DELETE
body:
  type: urlencoded
  content:
    email: "{{account_email}}"
    password: "{{account_password}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 200\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(200);\r

      });\r

      \r

      pm.test(\"Account deletion message is correct\", function () {\r

      \    pm.expect(response.message).to.eql(\"Account deleted!\");\r

      });"
    language: text/javascript
examples: .resources/API-ACCOUNT-002.resources/examples
