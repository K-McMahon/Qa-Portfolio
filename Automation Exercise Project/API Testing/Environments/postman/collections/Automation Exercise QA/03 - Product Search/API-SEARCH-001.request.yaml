$kind: http-request
name: API-SEARCH-001 - Search Product
description: "RTM: REQ-API-005 | Expected response code: 200 | Expected response: Searched products list"
url: "{{base_url}}/searchProduct?=top"
method: POST
queryParams:
  - key: ""
    value: top
    disabled: false
    description: ""
body:
  type: urlencoded
  content:
    search_product: top
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 200\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(200);\r

      });\r

      \r

      pm.test(\"Searched products list is present\", function () {\r

      \    pm.expect(response.products).to.be.an(\"array\");\r

      \    pm.expect(response.products.length).to.be.above(0);\r

      });\r

      \r

      pm.test(\"Returned products contain expected fields\", function () {\r

      \    const product = response.products[0];\r

      \r

      \    pm.expect(product).to.have.property(\"id\");\r

      \    pm.expect(product).to.have.property(\"name\");\r

      \    pm.expect(product).to.have.property(\"price\");\r

      \    pm.expect(product).to.have.property(\"brand\");\r

      \    pm.expect(product).to.have.property(\"category\");\r

      });"
    language: text/javascript
examples: .resources/API-SEARCH-001.resources/examples
order: 1000
