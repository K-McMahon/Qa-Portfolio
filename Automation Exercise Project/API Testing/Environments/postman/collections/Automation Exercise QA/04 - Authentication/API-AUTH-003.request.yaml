$kind: http-request
name: API-AUTH-003 - DELETE to Verify Login
description: "RTM: REQ-API-009 | Expected response code: 405 | Expected message: This request method is not supported."
url: "{{base_url}}/verifyLogin"
method: DELETE
scripts:
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 405\", function () {\r

      \    pm.response.to.have.status(405);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 405\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(405);\r

      });\r

      \r

      pm.test(\"Unsupported method message is correct\", function () {\r

      \    pm.expect(response.message)\r

      \        .to.eql(\"This request method is not supported.\");\r

      });"
    language: text/javascript
examples: .resources/API-AUTH-003.resources/examples
order: 3000
