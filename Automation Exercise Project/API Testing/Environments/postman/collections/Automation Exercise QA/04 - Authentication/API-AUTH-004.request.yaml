$kind: http-request
name: API-AUTH-004 - Verify Login with Invalid Details
description: "RTM: REQ-API-010 | Expected response code: 404 | Expected message: User not found!"
url: "{{base_url}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{invalid_email}}"
    password: "{{invalid_password}}"
scripts:
  - type: beforeRequest
    code: ""
    language: text/javascript
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 404\", function () {\r

      \    pm.response.to.have.status(404);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 404\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(404);\r

      });\r

      \r

      pm.test(\"Invalid-user message is correct\", function () {\r

      \    pm.expect(response.message).to.eql(\"User not found!\");\r

      });"
    language: text/javascript
examples: .resources/API-AUTH-004.resources/examples
order: 4000
