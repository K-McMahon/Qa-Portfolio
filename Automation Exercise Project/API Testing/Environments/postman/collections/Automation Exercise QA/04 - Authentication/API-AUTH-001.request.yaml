$kind: http-request
name: API-AUTH-001 - Verify Login with Valid Details
description: "RTM: REQ-API-007 | Expected response code: 200 | Expected message: User exists!"
url: "{{base_url}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    email: "{{valid_email}}"
    password: "{{valid_password}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 200\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(200);\r

      });\r

      \r

      pm.test(\"Valid-user message is correct\", function () {\r

      \    pm.expect(response.message).to.eql(\"User exists!\");\r

      });"
    language: text/javascript
examples: .resources/API-AUTH-001.resources/examples
order: 1000
