$kind: http-request
name: API-AUTH-002 - Verify Login Without Email
description: "RTM: REQ-API-008 | Expected response code: 400 | Expected message: Bad request, email or password parameter is missing in POST request."
url: "{{base_url}}/verifyLogin"
method: POST
body:
  type: urlencoded
  content:
    password: "{{valid_password}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"HTTP status code is 400\", function () {\r

      \    pm.response.to.have.status(400);\r

      });\r

      \r

      const response = pm.response.json();\r

      \r

      pm.test(\"Business response code is 400\", function () {\r

      \    pm.expect(Number(response.responseCode)).to.eql(400);\r

      });\r

      \r

      pm.test(\"Missing credential message is correct\", function () {\r

      \    pm.expect(response.message)\r

      \        .to.eql(\"Bad request, email or password parameter is missing in POST request.\");\r

      });"
    language: text/javascript
examples: .resources/API-AUTH-002.resources/examples
order: 2000
